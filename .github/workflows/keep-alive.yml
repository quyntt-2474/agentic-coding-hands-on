name: keep-alive

# Pings the Render service so its web instance does not spin down after 15 min idle.
# Set the repo/environment variable RENDER_SERVICE_URL to the service base URL,
# e.g. https://your-service.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.RENDER_SERVICE_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_SERVICE_URL is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${URL%/}/health" || echo "Ping failed (service may be waking up)."
